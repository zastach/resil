name: Resil Build

on:
  push:
    branches: [resil-discord-access, npc-studio-foundation]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Docker build
        run: docker build -t resil:test .

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish image
        run: |
          docker tag resil:test ghcr.io/zastach/resil:donor
          docker push ghcr.io/zastach/resil:donor
